# Локальный диагностический веб-сайт. Каждый агент может писать только в свой том трассировки.
services:
  assistent:
    image: viio-assistent:diagnostics
    environment:
      - VIIO_TRACE_DIR=/traces
      - PHOENIX_ENABLED=${PHOENIX_ENABLED:-false}
      - PHOENIX_COLLECTOR_ENDPOINT=${PHOENIX_COLLECTOR_ENDPOINT:-http://phoenix:6006/v1/traces}
      - PHOENIX_PROJECT_NAME=${PHOENIX_PROJECT_NAME:-viio}
      - OTEL_PYTHON_EXCLUDED_URLS=/healthz?,/metrics,/readyz
      - OTEL_PYTHON_FASTAPI_EXCLUDED_URLS=/healthz?,/metrics,/readyz
    volumes:
      - assistant_traces:/traces
    networks:
      - viio_net
      - phoenix_net
  consultant:
    image: viio-consultant:diagnostics
    environment:
      - VIIO_TRACE_DIR=/traces
      - PHOENIX_ENABLED=${PHOENIX_ENABLED:-false}
      - PHOENIX_COLLECTOR_ENDPOINT=${PHOENIX_COLLECTOR_ENDPOINT:-http://phoenix:6006/v1/traces}
      - PHOENIX_PROJECT_NAME=${PHOENIX_PROJECT_NAME:-viio-consultant}
    volumes:
      - consultant_traces:/traces
    networks:
      - viio_net
      - phoenix_net
  diagnostics:
    build: ./services/diagnostics
    container_name: viio_diagnostics
    ports:
      - 127.0.0.1:3010:3010
    volumes:
      - assistant_traces:/traces/main:ro
      - consultant_traces:/traces/consultant:ro
      - documents_traces:/traces/documents:ro
      - document_worker_traces:/traces/document-worker:ro
      - rag_traces:/traces/rag:ro
      - diagnostic_reviews:/data/reviews
    read_only: true
    user: 65532:65532
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3010/health')"]
      interval: 15s
      timeout: 3s
      retries: 3
  document-worker:
    image: viio-documents:diagnostics
    environment:
      - VIIO_TRACE_DIR=/traces
    volumes:
      - document_worker_traces:/traces
  rag:
    image: viio-rag:diagnostics
    environment:
      - VIIO_TRACE_DIR=/traces
    volumes:
      - rag_traces:/traces
  documents:
    image: viio-documents:diagnostics
    environment:
      - VIIO_TRACE_DIR=/traces
    volumes:
      - documents_traces:/traces
volumes:
  assistant_traces:
  consultant_traces:
  diagnostic_reviews:
  documents_traces:
  document_worker_traces:
  rag_traces:

networks:
  viio_net:
    name: viio_viio_net
    external: true
  phoenix_net:
    name: phoenix_net
    external: true
