[project]
name = "assistent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kanl", email = "106077541+kanl222@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain[mcp]>=1.4.7",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.17",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langmem>=0.0.30,<0.1",
    "mcp>=2.3,<3",
    "psycopg[binary,pool]>=3.2.0",
    "pydantic-settings>=2.16.1",
    "uvicorn[standard]>=0.54.0",
    "fastmcp>=4.1.6,<5",
    "redis>=5.0.0",
    "neo4j>=6.4.1",
    "viio-core",
]

[project.scripts]
assistent = "assistent:main"

[tool.uv.sources]
viio-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
