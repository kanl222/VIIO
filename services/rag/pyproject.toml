[project]
name = "viio-rag"
version = "0.1.0"
description = "VIIO retrieval, indexes and independent read-only RAG API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.162.0",
  "httpx>=0.28.1",
  "langchain-core>=1.4",
  "langchain-ollama>=1.1.0",
  "langchain-openai>=1.7.2",
  "langchain-qdrant>=1.1.0",
  "langchain-text-splitters>=1.1.3",
  "psycopg[binary,pool]>=3.2.0",
  "pydantic-settings>=2.16.1",
  "qdrant-client>=1.20.0",
  "uvicorn[standard]>=0.54.0",
  "openai>=3.39.0",
  "fastembed>=0.9.0",
  "redis>=5.0.0",
  "neo4j>=6.4.1",
  "viio-core",
]

[tool.uv.sources]
viio-core = { workspace = true }

[project.optional-dependencies]
yandex = ["yandex-ai-studio-sdk==0.22.1", "openai>=3.39.0", "python-dotenv>=1.2.4"]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pypdf>=6,<7",
  "python-docx>=1.2,<2",
  "odfpy>=1.4.1,<2",
  "langgraph>=1.2.17",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
