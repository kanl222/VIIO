[project]
name = "viio-consultant"
version = "0.1.0"
description = "Standalone VIIO consultant for explicitly published materials"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.162.0",
  "httpx>=0.28.1",
  "langchain-openai>=1.7.2",
  "langchain-ollama>=1.1.0",
  "langgraph>=1.2.17",
  "pydantic-settings>=2.16.1",
  "uvicorn[standard]>=0.54.0",
  "viio-core",
]

[tool.uv.sources]
viio-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0"]
