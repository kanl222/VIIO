# =============================================================
# Upstream definitions for VIIO services
# =============================================================
upstream webchat_upstream {
    server webchat:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream assistent_upstream {
    server assistent:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream consultant_upstream {
    server consultant:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream documents_upstream {
    server documents:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream rag_upstream {
    server rag:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream diagnostics_upstream {
    server diagnostics:3010 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# =============================================================
# Main Gateway (Port 80)
# WebChat UI, Streaming Chat, REST APIs, Uploads, Healthcheck
# =============================================================
server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 50M;
    client_body_buffer_size 16M;

    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    send_timeout 600s;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # Nginx Healthcheck endpoint
    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Direct API: Assistent Chat, Streaming SSE & Token Usage
    location ~ ^/api/v1/(chat|usage|context|access-revision)(/|$) {
        proxy_pass http://assistent_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 600s;
    }

    # Direct API: Consultant Chat & Streaming SSE
    location ~ ^/api/v1/consultant(/|$) {
        proxy_pass http://consultant_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 600s;
    }

    # Direct API: Documents Catalog, Ingestion, OCR & Published Materials
    location ~ ^/api/v1/(documents|consultant-materials)(/|$) {
        proxy_pass http://documents_upstream;
        proxy_http_version 1.1;
        client_max_body_size 50M;
        proxy_read_timeout 600s;
    }

    # Direct API: Knowledge Base Search
    location ~ ^/api/v1/knowledge(/|$) {
        proxy_pass http://rag_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 600s;
    }

    # Diagnostics APIs: Traces & Reviews (SSE Traces Stream supported)
    location ~ ^/api/(traces|reviews)(/|$) {
        proxy_pass http://diagnostics_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host localhost:3010;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 600s;
    }

    # WebChat UI & Internal Endpoints (/api/auth, /api/conversations, /api/chat, /api/admin)
    location / {
        proxy_pass http://webchat_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
}

# =============================================================
# Diagnostics Dashboard Gateway (Port 8080)
# Traces viewer, real-time SSE stream, and expert evaluation
# =============================================================
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    client_max_body_size 10M;

    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    send_timeout 600s;

    location / {
        proxy_pass http://diagnostics_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host localhost:3010;
        proxy_set_header Origin http://localhost:3010;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 600s;
    }
}
