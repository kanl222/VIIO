services:
  postgres:
    image: postgres:16-alpine
    container_name: viio_postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - viio_net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: viio_qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # The official image has Bash but no wget/curl. Check HTTP readiness directly.
      test:
        - CMD
        - bash
        - -ec
        - 'exec 3<>/dev/tcp/127.0.0.1/6333; printf "GET /readyz HTTP/1.0\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; read -r protocol status rest <&3; test "$$status" = 200'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - viio_net

  apiagent:
    build:
      context: ./APIAgent
      dockerfile: Dockerfile
    container_name: viio_apiagent
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-lmstudio}
      - LMSTUDIO_BASE_URL=${LMSTUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
      - LMSTUDIO_API_KEY=${LMSTUDIO_API_KEY:-lm-studio}
      - LMSTUDIO_MODEL=${LMSTUDIO_MODEL:-qwen/qwen3-4b-2507}
      - LMSTUDIO_EMBEDDING_MODEL=${LMSTUDIO_EMBEDDING_MODEL:-text-embedding-nomic-embed-text-v1.5}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1}
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION_NAME=${QDRANT_COLLECTION_NAME:-knowledge_base}
      - RAG_CHUNK_UNIT=${RAG_CHUNK_UNIT:-characters}
      - RAG_CHUNK_SIZE=${RAG_CHUNK_SIZE:-500}
      - RAG_CHUNK_OVERLAP=${RAG_CHUNK_OVERLAP:-50}
      - RAG_CONTEXT_MAX_CHARS=${RAG_CONTEXT_MAX_CHARS:-12000}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=agent_db
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-viio-internal-secret-token}
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - CODING_AGENT_ENABLED=${CODING_AGENT_ENABLED:-true}
      - CODING_MODEL=${CODING_MODEL:-}
      - CODING_ALLOWED_ROLES=${CODING_ALLOWED_ROLES:-["programmer","admin"]}
      - CODING_CONTEXT_MAX_CHARS=${CODING_CONTEXT_MAX_CHARS:-6000}
      - CONVERSATION_SUMMARY_ENABLED=${CONVERSATION_SUMMARY_ENABLED:-true}
      - CONVERSATION_SUMMARY_AFTER=${CONVERSATION_SUMMARY_AFTER:-24}
      - CONVERSATION_HISTORY_MAX_CHARS=${CONVERSATION_HISTORY_MAX_CHARS:-18000}
      - CONSULTANT_ENABLED=${CONSULTANT_ENABLED:-false}
      - CONSULTANT_API_KEY=${CONSULTANT_API_KEY:-}
      - CHAT_TEMPERATURE=${CHAT_TEMPERATURE:-0.0}
      - CHAT_TOP_P=${CHAT_TOP_P:-1.0}
      - CHAT_MAX_TOKENS=${CHAT_MAX_TOKENS:-2048}
      - CODING_TEMPERATURE=${CODING_TEMPERATURE:-0.0}
      - CODING_TOP_P=${CODING_TOP_P:-1.0}
      - CODING_MAX_TOKENS=${CODING_MAX_TOKENS:-4096}
      - PGSQL_ENABLED=${PGSQL_ENABLED:-false}
      - PGSQL_MCP_URL=${PGSQL_MCP_URL:-http://postgres-tool:8000/sse}
      - PGSQL_MAX_ROWS=${PGSQL_MAX_ROWS:-100}
      - PGSQL_MAX_CHARS=${PGSQL_MAX_CHARS:-12000}
      - PGSQL_TIMEOUT_SECONDS=${PGSQL_TIMEOUT_SECONDS:-40}
      - PDF_ENGINE=${PDF_ENGINE:-auto}
      - PDF_MAX_PAGES=${PDF_MAX_PAGES:-50}
      - PDF_MAX_CHARS=${PDF_MAX_CHARS:-500000}
      - PDF_TIMEOUT_SECONDS=${PDF_TIMEOUT_SECONDS:-120}
      - DOCLING_URL=${DOCLING_URL:-http://pdf-worker:8080}
      - DOCUMENTS_STORAGE_PATH=/data/documents
      - DOCUMENTS_CATALOG_ENABLED=${DOCUMENTS_CATALOG_ENABLED:-true}
      - BULK_MAX_FILES=${BULK_MAX_FILES:-50}
      - BULK_MAX_FILE_BYTES=${BULK_MAX_FILE_BYTES:-10485760}
      - BULK_MAX_WORKERS=${BULK_MAX_WORKERS:-2}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      viio_net:
        aliases:
          - apiagent
          - api
    volumes:
      - documents_storage:/data/documents

  webchat:
    build:
      context: ./WebChat
      dockerfile: Dockerfile
    container_name: viio_webchat
    ports:
      - "${WEBCHAT_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
      - AGENTAI_URL=http://apiagent:8000
      - BOOTSTRAP_ADMIN_USERNAME=${BOOTSTRAP_ADMIN_USERNAME:-}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:-}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=user_db
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/user_db
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-viio-internal-secret-token}
    depends_on:
      apiagent:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - viio_net


  postgres-tool:
    image: crystaldba/postgres-mcp@sha256:dbbd346860d29f1543e991f30f3284bf4ab5f096d049ecc3426528f20b1b6e6b
    profiles: [postgres]
    entrypoint: [python, /viio/start.py]
    environment:
      - PGSQL_HOST=${PGSQL_HOST:-host.docker.internal}
      - PGSQL_PORT=${PGSQL_PORT:-5432}
      - PGSQL_DATABASE=${PGSQL_DATABASE:-}
      - PGSQL_USER=${PGSQL_USER:-}
      - PGSQL_PASSWORD=${PGSQL_PASSWORD:-}
      - PGSQL_SSLMODE=${PGSQL_SSLMODE:-prefer}
    volumes:
      - ./postgres-tool/start.py:/viio/start.py:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - viio_net

  pdf-worker:
    build: ./pdf-worker
    profiles: [pdf]
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-viio-internal-secret-token}
      - PDF_MAX_PAGES=${PDF_MAX_PAGES:-50}
      - PDF_MAX_CHARS=${PDF_MAX_CHARS:-500000}
      - PDF_TIMEOUT_SECONDS=${PDF_TIMEOUT_SECONDS:-120}
      - DOCLING_CPU_THREADS=${DOCLING_CPU_THREADS:-2}
    volumes:
      - docling_models:/models
    mem_limit: 4g
    cpus: 2
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 180s
    networks:
      - viio_net

networks:
  viio_net:
    driver: bridge

volumes:
  qdrant_storage:
  postgres_data:
  docling_models:
  documents_storage:
