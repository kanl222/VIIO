services:
  postgres:
    image: postgres:16-alpine
    container_name: viio_postgres
    mem_limit: 1024m
    environment:
    - POSTGRES_USER=${POSTGRES_USER:-postgres}
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Configure a deployment password}
    - POSTGRES_DB=${POSTGRES_DB:-postgres}
    ports:
    - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    volumes:
    - postgres_data:/var/lib/postgresql/data
    - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-postgres}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
    - viio_net
  qdrant:
    image: qdrant/qdrant:v1.20.0
    container_name: viio_qdrant
    mem_limit: 1536m
    ports:
    - 127.0.0.1:${QDRANT_PORT:-6333}:6333
    - 127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334
    volumes:
    - qdrant_storage:/qdrant/storage
    healthcheck:
      test:
      - CMD
      - bash
      - -ec
      - 'exec 3<>/dev/tcp/127.0.0.1/6333; printf "GET /readyz HTTP/1.0\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; read -r protocol status rest <&3; test "$$status" = 200'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
    - viio_net
    environment:
    - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:?Configure QDRANT_API_KEY in .env}
    - QDRANT__SERVICE__READ_ONLY_API_KEY=${QDRANT_READ_KEY:?Configure QDRANT_READ_KEY in .env}
  redis:
    image: redis:7.2-alpine
    container_name: viio_redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "volatile-lru"]
    mem_limit: 512m
    ports:
    - 127.0.0.1:${REDIS_PORT:-6379}:6379
    volumes:
    - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
    - viio_net
  memgraph:
    image: memgraph/memgraph-platform:latest
    container_name: viio_memgraph
    mem_limit: 2048m
    ports:
    - 127.0.0.1:${MEMGRAPH_PORT:-7687}:7687
    - 127.0.0.1:${MEMGRAPH_LAB_PORT:-3001}:3000
    environment:
    - MEMGRAPH="--log-level=WARNING --telemetry-enabled=false --data-recovery-on-startup=true"
    volumes:
    - memgraph_data:/var/lib/memgraph
    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 1;' | mgconsole || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
    - viio_net
  document-worker:
    image: viio-documents:latest
    cpus: ${DOCUMENT_WORKER_CPUS:-1}
    mem_limit: ${DOCUMENT_WORKER_MEMORY:-2g}
    build:
      context: .
      dockerfile: services/documents/Dockerfile
    container_name: viio_document_worker
    environment:
    - LLM_PROVIDER=${LOCAL_LLM_PROVIDER:-lmstudio}
    - LMSTUDIO_BASE_URL=${LMSTUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
    - LMSTUDIO_API_KEY=${LMSTUDIO_API_KEY:-lm-studio}
    - LMSTUDIO_EMBEDDING_MODEL=${LMSTUDIO_EMBEDDING_MODEL:-text-embedding-nomic-embed-text-v1.5}
    - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
    - QDRANT_URL=http://qdrant:6333
    - QDRANT_COLLECTION_NAME=${QDRANT_COLLECTION_NAME:-knowledge_base}
    - QDRANT_PUBLIC_COLLECTION_NAME=${QDRANT_PUBLIC_COLLECTION_NAME:-knowledge_public}
    - RAG_CHUNK_UNIT=${RAG_CHUNK_UNIT:-characters}
    - RAG_CHUNK_SIZE=${RAG_CHUNK_SIZE:-500}
    - RAG_CHUNK_OVERLAP=${RAG_CHUNK_OVERLAP:-50}
    - POSTGRES_HOST=postgres
    - POSTGRES_PORT=5432
    - POSTGRES_DB=agent_db
    - POSTGRES_USER=${POSTGRES_USER:-postgres}
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}
    - VIIO_TRACE_DIR=/traces
    - PDF_ENGINE=${PDF_ENGINE:-auto}
    - PDF_MAX_BYTES=${PDF_MAX_BYTES:-33554432}
    - PDF_MAX_PAGES=${PDF_MAX_PAGES:-200}
    - PDF_MAX_CHARS=${PDF_MAX_CHARS:-500000}
    - PDF_TIMEOUT_SECONDS=${PDF_TIMEOUT_SECONDS:-1800}
    - DOCLING_URL=${DOCLING_URL:-http://pdf-worker:8080}
    - DOCUMENTS_STORAGE_PATH=/data/documents
    - DOCUMENTS_CATALOG_ENABLED=${DOCUMENTS_CATALOG_ENABLED:-true}
    - BULK_MAX_FILES=${BULK_MAX_FILES:-50}
    - BULK_MAX_FILE_BYTES=${BULK_MAX_FILE_BYTES:-10485760}
    - BULK_MAX_WORKERS=${BULK_MAX_WORKERS:-1}
    - SERVICE_ROLE=document-worker
    - SECURE_RUNTIME=true
    - DATABASE_MIGRATIONS_ENABLED=false
    - DOCUMENT_WORKER_KEY=${DOCUMENT_WORKER_KEY:?Configure DOCUMENT_WORKER_KEY in .env}
    - QDRANT_API_KEY=${QDRANT_API_KEY:?Configure QDRANT_API_KEY in .env}
    - DOCLING_API_KEY=${DOCLING_API_KEY:?Configure DOCLING_API_KEY in .env}
    - DOCUMENT_WORKER_KEY_PREVIOUS=${DOCUMENT_WORKER_KEY_PREVIOUS:-}
    extra_hosts:
    - host.docker.internal:host-gateway
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: unless-stopped
    volumes:
    - documents_storage:/data/documents
    - document_worker_traces:/traces
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
    - viio_net
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp:size=256m
    pids_limit: 256
    user: 65532:65532
  rag:
    image: viio-rag:latest
    build:
      context: .
      dockerfile: services/rag/Dockerfile
    container_name: viio_rag
    command: [uvicorn, 'viio_rag.app:create_app', --factory, --host, 0.0.0.0, --port, '8000']
    environment:
    - SERVICE_ROLE=rag
    - RAG_YANDEX_API_KEY=${RAG_YANDEX_API_KEY:-${CONSULTANT_YANDEX_API_KEY:-}}
    - RAG_YANDEX_FOLDER_ID=${RAG_YANDEX_FOLDER_ID:-${CONSULTANT_YANDEX_FOLDER_ID:-}}
    - RAG_YANDEX_INDEX_ID=${RAG_YANDEX_INDEX_ID:-}
    - RAG_YANDEX_MODEL=${RAG_YANDEX_MODEL:-aliceai-llm}
    - RAG_YANDEX_MANIFEST=/data/rag-state/yandex-rag-runtime.json
    - RAG_YANDEX_ASSISTANT_PROMPT=${RAG_YANDEX_ASSISTANT_PROMPT:-}
    - RAG_YANDEX_CONSULTANT_PROMPT=${RAG_YANDEX_CONSULTANT_PROMPT:-}
    - SECURE_RUNTIME=true
    - DATABASE_MIGRATIONS_ENABLED=false
    - LLM_PROVIDER=${LOCAL_LLM_PROVIDER:-lmstudio}
    - LMSTUDIO_BASE_URL=${LMSTUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
    - LMSTUDIO_API_KEY=${LMSTUDIO_API_KEY:-lm-studio}
    - LMSTUDIO_EMBEDDING_MODEL=${LMSTUDIO_EMBEDDING_MODEL:-text-embedding-nomic-embed-text-v1.5}
    - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
    - QDRANT_URL=http://qdrant:6333
    - QDRANT_COLLECTION_NAME=${QDRANT_COLLECTION_NAME:-knowledge_base}
    - QDRANT_PUBLIC_COLLECTION_NAME=${QDRANT_PUBLIC_COLLECTION_NAME:-knowledge_public}
    - QDRANT_API_KEY=${QDRANT_READ_KEY:?Configure QDRANT_READ_KEY in .env}
    - POSTGRES_HOST=postgres
    - POSTGRES_PORT=5432
    - POSTGRES_DB=agent_db
    - POSTGRES_USER=${POSTGRES_USER:-postgres}
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}
    - DOCUMENTS_READ_KEY=${DOCUMENTS_READ_KEY:?Configure DOCUMENTS_READ_KEY in .env}
    - DOCUMENTS_READ_KEY_PREVIOUS=${DOCUMENTS_READ_KEY_PREVIOUS:-}
    - CONSULTANT_SOURCE_KEY=${CONSULTANT_SOURCE_KEY:?Configure CONSULTANT_SOURCE_KEY in .env}
    - MEMGRAPH_URI=${MEMGRAPH_URI:-bolt://memgraph:7687}
    - MEMGRAPH_ENABLED=${MEMGRAPH_ENABLED:-true}
    - REDIS_URL=${RAG_REDIS_URL:-redis://redis:6379/0}
    - RERANKER_ENABLED=${RERANKER_ENABLED:-false}
    - RERANKER_MODEL=${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
    - RERANKER_TOP_K=${RERANKER_TOP_K:-25}
    - FASTEMBED_CACHE_PATH=/tmp/fastembed
    - HF_HOME=/tmp/huggingface
    - VIIO_TRACE_DIR=/traces
    extra_hosts:
    - host.docker.internal:host-gateway
    depends_on:
      memgraph:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: unless-stopped
    networks:
    - viio_net
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
    - /tmp:size=256m
    pids_limit: 128
    mem_limit: 768m
    volumes:
    - ./services/rag/src:/app/services/rag/src:ro
    - ./services/rag/state:/data/rag-state:ro
    - rag_traces:/traces
    user: 65532:65532
  documents:
    image: viio-documents:latest
    build:
      context: .
      dockerfile: services/documents/Dockerfile
    container_name: viio_documents
    ports:
    - 127.0.0.1:${DOCUMENTS_PORT:-8002}:8000
    environment:
    - LLM_PROVIDER=${LOCAL_LLM_PROVIDER:-lmstudio}
    - LMSTUDIO_BASE_URL=${LMSTUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
    - LMSTUDIO_API_KEY=${LMSTUDIO_API_KEY:-lm-studio}
    - LMSTUDIO_EMBEDDING_MODEL=${LMSTUDIO_EMBEDDING_MODEL:-text-embedding-nomic-embed-text-v1.5}
    - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
    - QDRANT_URL=http://qdrant:6333
    - QDRANT_COLLECTION_NAME=${QDRANT_COLLECTION_NAME:-knowledge_base}
    - QDRANT_PUBLIC_COLLECTION_NAME=${QDRANT_PUBLIC_COLLECTION_NAME:-knowledge_public}
    - RAG_CHUNK_UNIT=${RAG_CHUNK_UNIT:-characters}
    - RAG_CHUNK_SIZE=${RAG_CHUNK_SIZE:-500}
    - RAG_CHUNK_OVERLAP=${RAG_CHUNK_OVERLAP:-50}
    - POSTGRES_HOST=postgres
    - POSTGRES_PORT=5432
    - POSTGRES_DB=agent_db
    - POSTGRES_USER=${POSTGRES_USER:-postgres}
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}
    - CONSULTANT_API_KEY=${CONSULTANT_API_KEY:-}
    - CONSULTANT_SOURCE_KEY=${CONSULTANT_SOURCE_KEY:-}
    - PDF_ENGINE=${PDF_ENGINE:-auto}
    - PDF_MAX_BYTES=${PDF_MAX_BYTES:-33554432}
    - PDF_MAX_PAGES=${PDF_MAX_PAGES:-200}
    - PDF_MAX_CHARS=${PDF_MAX_CHARS:-500000}
    - PDF_TIMEOUT_SECONDS=${PDF_TIMEOUT_SECONDS:-1800}
    - DOCLING_URL=${DOCLING_URL:-http://pdf-worker:8080}
    - DOCUMENTS_STORAGE_PATH=/data/documents
    - DOCUMENTS_CATALOG_ENABLED=${DOCUMENTS_CATALOG_ENABLED:-true}
    - BULK_MAX_FILES=${BULK_MAX_FILES:-50}
    - BULK_MAX_FILE_BYTES=${BULK_MAX_FILE_BYTES:-10485760}
    - BULK_MAX_WORKERS=${BULK_MAX_WORKERS:-1}
    - SERVICE_ROLE=documents
    - RAG_URL=http://rag:8000
    - RAG_TIMEOUT_SECONDS=${RAG_TIMEOUT_SECONDS:-60}
    - DOCUMENT_WORKER_URL=http://document-worker:8000
    - SECURE_RUNTIME=true
    - DATABASE_MIGRATIONS_ENABLED=false
    - DOCUMENTS_READ_KEY=${DOCUMENTS_READ_KEY:?Configure DOCUMENTS_READ_KEY in .env}
    - DOCUMENTS_ADMIN_KEY=${DOCUMENTS_ADMIN_KEY:?Configure DOCUMENTS_ADMIN_KEY in .env}
    - DOCUMENT_WORKER_KEY=${DOCUMENT_WORKER_KEY:?Configure DOCUMENT_WORKER_KEY in .env}
    - QDRANT_API_KEY=${QDRANT_READ_KEY:?Configure QDRANT_READ_KEY in .env}
    - DOCUMENTS_READ_KEY_PREVIOUS=${DOCUMENTS_READ_KEY_PREVIOUS:-}
    - DOCUMENTS_ADMIN_KEY_PREVIOUS=${DOCUMENTS_ADMIN_KEY_PREVIOUS:-}
    - VIIO_TRACE_DIR=/traces
    extra_hosts:
    - host.docker.internal:host-gateway
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: unless-stopped
    volumes:
    - documents_storage:/data/documents
    - documents_traces:/traces
    depends_on:
      document-worker:
        condition: service_healthy
      rag:
        condition: service_healthy
    networks:
    - viio_net
    - consultant_net
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp:size=256m
    pids_limit: 256
    mem_limit: 1024m
    user: 65532:65532
  assistent:
    image: viio-assistent:latest
    build:
      context: .
      dockerfile: services/assistent/Dockerfile
    container_name: viio_assistent
    ports:
    - 127.0.0.1:${ASSISTENT_PORT:-${API_PORT:-8000}}:8000
    environment:
    - LLM_PROVIDER=${LLM_PROVIDER:-lmstudio}
    - LMSTUDIO_BASE_URL=${LMSTUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
    - LMSTUDIO_API_KEY=${LMSTUDIO_API_KEY:-lm-studio}
    - LMSTUDIO_MODEL=${LMSTUDIO_MODEL:-qwen/qwen3-4b-2507}
    - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1}
    - RAG_CONTEXT_MAX_CHARS=${RAG_CONTEXT_MAX_CHARS:-4500}
    - POSTGRES_HOST=postgres
    - POSTGRES_PORT=5432
    - POSTGRES_DB=agent_db
    - POSTGRES_USER=${POSTGRES_USER:-postgres}
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}
    - API_HOST=0.0.0.0
    - API_PORT=8000
    - CODING_AGENT_ENABLED=${CODING_AGENT_ENABLED:-true}
    - GITHUB_MCP_ENABLED=${GITHUB_MCP_ENABLED:-false}
    - GITHUB_MCP_TOKEN=${GITHUB_MCP_TOKEN:-}
    - GITHUB_REPOSITORY=${GITHUB_REPOSITORY:-}
    - GITHUB_MCP_MAX_CHARS=${GITHUB_MCP_MAX_CHARS:-16000}
    - GITHUB_MCP_TIMEOUT_SECONDS=${GITHUB_MCP_TIMEOUT_SECONDS:-25}
    - ASSISTANT_RAG_BACKEND=${ASSISTANT_RAG_BACKEND:-local}
    - CHAT_PROVIDER=${CHAT_PROVIDER:-${LLM_PROVIDER:-lmstudio}}
    - CHAT_MODEL=${CHAT_MODEL:-}
    - ROUTING_PROVIDER=${ROUTING_PROVIDER:-}
    - ROUTING_MODEL=${ROUTING_MODEL:-}
    - ROUTING_MAX_TOKENS=${ROUTING_MAX_TOKENS:-128}
    - CODING_PROVIDER=${CODING_PROVIDER:-${LLM_PROVIDER:-lmstudio}}
    - YANDEX_API_KEY=${YANDEX_API_KEY:-}
    - YANDEX_FOLDER_ID=${YANDEX_FOLDER_ID:-}
    - YANDEX_MODEL=${YANDEX_MODEL:-aliceai-llm}
    - YANDEX_TIMEOUT_SECONDS=${YANDEX_TIMEOUT_SECONDS:-60}
    - DATABASE_PROVIDER=${DATABASE_PROVIDER:-${LLM_PROVIDER:-lmstudio}}
    - DATABASE_MODEL=${DATABASE_MODEL:-}
    - CODING_MODEL=${CODING_MODEL:-}
    - CODING_ALLOWED_ROLES=${CODING_ALLOWED_ROLES:-["programmer","admin"]}
    - CODING_CONTEXT_MAX_CHARS=${CODING_CONTEXT_MAX_CHARS:-6000}
    - CONVERSATION_SUMMARY_ENABLED=${CONVERSATION_SUMMARY_ENABLED:-true}
    - CONVERSATION_SUMMARY_AFTER=${CONVERSATION_SUMMARY_AFTER:-24}
    - CONVERSATION_HISTORY_MAX_CHARS=${CONVERSATION_HISTORY_MAX_CHARS:-18000}
    - CHAT_TEMPERATURE=${CHAT_TEMPERATURE:-0.0}
    - CHAT_TOP_P=${CHAT_TOP_P:-1.0}
    - CHAT_MAX_TOKENS=${CHAT_MAX_TOKENS:-2048}
    - CODING_TEMPERATURE=${CODING_TEMPERATURE:-0.0}
    - CODING_TOP_P=${CODING_TOP_P:-1.0}
    - CODING_MAX_TOKENS=${CODING_MAX_TOKENS:-4096}
    - PGSQL_ENABLED=${PGSQL_ENABLED:-false}
    - PGSQL_MCP_URL=${PGSQL_MCP_URL:-http://postgres-tool:8000/sse}
    - PGSQL_MAX_ROWS=${PGSQL_MAX_ROWS:-100}
    - PGSQL_MAX_CHARS=${PGSQL_MAX_CHARS:-12000}
    - PGSQL_TIMEOUT_SECONDS=${PGSQL_TIMEOUT_SECONDS:-40}
    - MEMGRAPH_ENABLED=${MEMGRAPH_ENABLED:-false}
    - MEMGRAPH_URI=${MEMGRAPH_URI:-bolt://memgraph:7687}
    - SERVICE_ROLE=assistent
    - DOCUMENTS_URL=http://documents:8000
    - RAG_URL=http://rag:8000
    - RAG_TIMEOUT_SECONDS=${RAG_TIMEOUT_SECONDS:-120}
    - CHAT_TIMEOUT_SECONDS=${CHAT_TIMEOUT_SECONDS:-120}
    - SECURE_RUNTIME=true
    - DATABASE_MIGRATIONS_ENABLED=false
    - CHAT_API_KEY=${CHAT_API_KEY:?Configure CHAT_API_KEY in .env}
    - DOCUMENTS_READ_KEY=${DOCUMENTS_READ_KEY:?Configure DOCUMENTS_READ_KEY in .env}
    - DOCUMENTS_ADMIN_KEY=${DOCUMENTS_ADMIN_KEY:?Configure DOCUMENTS_ADMIN_KEY in .env}
    - CHAT_API_KEY_PREVIOUS=${CHAT_API_KEY_PREVIOUS:-}
    - AGENT_MAX_TOOL_CALLS=${AGENT_MAX_TOOL_CALLS:-24}
    - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    - SKILLS_ENABLED=${SKILLS_ENABLED:-true}
    - MODEL_FIRST_TOOLS=${MODEL_FIRST_TOOLS:-true}
    - VIIO_TRACE_DIR=/traces
    - PHOENIX_ENABLED=${PHOENIX_ENABLED:-false}
    - PHOENIX_COLLECTOR_ENDPOINT=${PHOENIX_COLLECTOR_ENDPOINT:-http://phoenix:6006/v1/traces}
    - PHOENIX_PROJECT_NAME=${PHOENIX_PROJECT_NAME:-viio}
    - OTEL_PYTHON_EXCLUDED_URLS=/healthz?,/metrics,/readyz
    - OTEL_PYTHON_FASTAPI_EXCLUDED_URLS=/healthz?,/metrics,/readyz
    extra_hosts:
    - host.docker.internal:host-gateway
    depends_on:
      documents:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
    - assistant_traces:/traces
    - ./services/assistent/src:/app/services/assistent/src:ro
    - ./Skills:/app/Skills:ro
    - ./.agents/skills:/app/.agents/skills:ro
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      viio_net:
        aliases:
        - api
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp:size=256m
    pids_limit: 256
    mem_limit: 1536m
    user: 65532:65532
  consultant:
    image: viio-consultant:latest
    build:
      context: .
      dockerfile: services/consultant/Dockerfile
    container_name: viio_consultant
    ports:
    - ${CONSULTANT_PORT:-8001}:8000
    environment:
    - CONSULTANT_ENABLED=${CONSULTANT_ENABLED:-false}
    - CONSULTANT_RAG_BACKEND=${CONSULTANT_RAG_BACKEND:-local}
    - CONSULTANT_YANDEX_ENABLED=${CONSULTANT_YANDEX_ENABLED:-false}
    - CONSULTANT_YANDEX_API_KEY=${CONSULTANT_YANDEX_API_KEY:-${YANDEX_API_KEY:-}}
    - CONSULTANT_YANDEX_FOLDER_ID=${CONSULTANT_YANDEX_FOLDER_ID:-${YANDEX_FOLDER_ID:-}}
    - CONSULTANT_YANDEX_MODEL=${CONSULTANT_YANDEX_MODEL:-${YANDEX_MODEL:-aliceai-llm}}
    - CONSULTANT_CLOUD_PUBLIC_MATERIAL_HASHES=${CONSULTANT_CLOUD_PUBLIC_MATERIAL_HASHES:-[]}
    - CONSULTANT_API_KEY=${CONSULTANT_API_KEY:-}
    - CONSULTANT_SOURCE_KEY=${CONSULTANT_SOURCE_KEY:-}
    - CONSULTANT_SOURCE_URL=http://documents:8000
    - CONSULTANT_PROVIDER=${CONSULTANT_PROVIDER:-${LLM_PROVIDER:-lmstudio}}
    - CONSULTANT_MODEL=${CONSULTANT_MODEL:-}
    - CONSULTANT_LMSTUDIO_BASE_URL=${CONSULTANT_LMSTUDIO_BASE_URL:-${LMSTUDIO_BASE_URL:-http://host.docker.internal:1234/v1}}
    - CONSULTANT_LMSTUDIO_API_KEY=${CONSULTANT_LMSTUDIO_API_KEY:-${LMSTUDIO_API_KEY:-lm-studio}}
    - CONSULTANT_LMSTUDIO_MODEL=${LMSTUDIO_MODEL:-qwen/qwen3-4b-2507}
    - CONSULTANT_OLLAMA_BASE_URL=${CONSULTANT_OLLAMA_BASE_URL:-${OLLAMA_BASE_URL:-http://host.docker.internal:11434}}
    - CONSULTANT_OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1}
    - CONSULTANT_TEMPERATURE=${CONSULTANT_TEMPERATURE:-0.0}
    - CONSULTANT_TOP_P=${CONSULTANT_TOP_P:-1.0}
    - CONSULTANT_MAX_TOKENS=${CONSULTANT_MAX_TOKENS:-2048}
    - VIIO_TRACE_DIR=/traces
    extra_hosts:
    - host.docker.internal:host-gateway
    depends_on:
      documents:
        condition: service_healthy
    volumes:
    - consultant_traces:/traces
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    read_only: true
    tmpfs:
    - /tmp:size=64m
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    pids_limit: 128
    mem_limit: 768m
    user: 65532:65532
    restart: unless-stopped
    networks:
    - consultant_net
  webchat:
    image: viio-webchat:latest
    build:
      context: ./apps/webchat
      dockerfile: Dockerfile
    container_name: viio_webchat
    ports:
    - ${WEBCHAT_PORT:-3000}:3000
    environment:
    - NODE_ENV=production
    - HOST=0.0.0.0
    - PORT=3000
    - ASSISTENT_URL=http://assistent:8000
    - DOCUMENTS_URL=http://documents:8000
    - BOOTSTRAP_ADMIN_USERNAME=${BOOTSTRAP_ADMIN_USERNAME:-}
    - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:-}
    - POSTGRES_HOST=postgres
    - POSTGRES_PORT=5432
    - POSTGRES_DB=user_db
    - POSTGRES_USER=${POSTGRES_USER:-postgres}
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}
    - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}@postgres:5432/user_db
    - CHAT_API_KEY=${CHAT_API_KEY:?Configure CHAT_API_KEY in .env}
    - DOCUMENTS_READ_KEY=${DOCUMENTS_READ_KEY:?Configure DOCUMENTS_READ_KEY in .env}
    - DOCUMENTS_ADMIN_KEY=${DOCUMENTS_ADMIN_KEY:?Configure DOCUMENTS_ADMIN_KEY in .env}
    - DATABASE_MIGRATIONS_ENABLED=false
    depends_on:
      assistent:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
    - viio_net
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp:size=256m
    pids_limit: 256
    mem_limit: 512m
  postgres-tool:
    image: crystaldba/postgres-mcp@sha256:dbbd346860d29f1543e991f30f3284bf4ab5f096d049ecc3426528f20b1b6e6b
    profiles:
    - postgres
    entrypoint:
    - python
    - /viio/start.py
    environment:
    - PGSQL_HOST=${PGSQL_HOST:-host.docker.internal}
    - PGSQL_PORT=${PGSQL_PORT:-5432}
    - PGSQL_DATABASE=${PGSQL_DATABASE:-}
    - PGSQL_USER=${PGSQL_USER:-}
    - PGSQL_PASSWORD=${PGSQL_PASSWORD:-}
    - PGSQL_SSLMODE=${PGSQL_SSLMODE:-prefer}
    volumes:
    - ./workers/postgres-tool/start.py:/viio/start.py:ro
    extra_hosts:
    - host.docker.internal:host-gateway
    restart: unless-stopped
    networks:
    - viio_net
  pdf-worker-init:
    image: alpine:latest
    container_name: viio_pdf_worker_init
    profiles:
    - pdf
    user: "0:0"
    volumes:
    - docling_models:/models
    command: ["sh", "-c", "mkdir -p /models/huggingface /models/torch /models/artifacts && chown -R 65532:65532 /models && chmod -R 775 /models"]
    restart: "no"
  pdf-worker:
    image: viio-pdf-worker:latest
    build: ./workers/pdf-worker
    profiles:
    - pdf
    depends_on:
      pdf-worker-init:
        condition: service_completed_successfully
    environment:
    - INTERNAL_API_KEY=${DOCLING_API_KEY:?Configure DOCLING_API_KEY in .env}
    - PDF_MAX_BYTES=${PDF_MAX_BYTES:-33554432}
    - PDF_MAX_PAGES=${PDF_MAX_PAGES:-200}
    - PDF_MAX_CHARS=${PDF_MAX_CHARS:-500000}
    - PDF_TIMEOUT_SECONDS=${PDF_TIMEOUT_SECONDS:-1800}
    - DOCLING_CPU_THREADS=${DOCLING_CPU_THREADS:-2}
    volumes:
    - docling_models:/models
    mem_limit: 4g
    cpus: 2
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 180s
    networks:
    - viio_net
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp:size=256m
    pids_limit: 256
    user: 65532:65532
  diagnostics:
    image: viio-diagnostics:latest
    build: ./services/diagnostics
    container_name: viio_diagnostics
    ports:
    - 127.0.0.1:${DIAGNOSTICS_PORT:-3010}:3010
    volumes:
    - assistant_traces:/traces/main:ro
    - consultant_traces:/traces/consultant:ro
    - documents_traces:/traces/documents:ro
    - document_worker_traces:/traces/document-worker:ro
    - rag_traces:/traces/rag:ro
    - diagnostic_reviews:/data/reviews
    read_only: true
    user: 65532:65532
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:3010/health')
      interval: 15s
      timeout: 3s
      retries: 3
    networks:
    - viio_net
  nginx:
    image: nginx:1.27-alpine
    container_name: viio_nginx
    ports:
    - "${GATEWAY_PORT:-80}:80"
    - "${DIAGNOSTICS_PROXY_PORT:-8080}:8080"
    volumes:
    - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    - ./nginx/conf.d:/etc/nginx/conf.d:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      webchat:
        condition: service_healthy
      assistent:
        condition: service_healthy
      documents:
        condition: service_healthy
    networks:
    - viio_net
    - consultant_net
    mem_limit: 256m
    cpus: 1
    security_opt:
    - no-new-privileges:true
networks:
  viio_net:
    driver: bridge
  consultant_net:
    driver: bridge
volumes:
  memgraph_data: {}
  redis_data: {}
  qdrant_storage: {}
  postgres_data: {}
  docling_models: {}
  documents_storage: {}
  assistant_traces: {}
  consultant_traces: {}
  documents_traces: {}
  document_worker_traces: {}
  rag_traces: {}
  diagnostic_reviews: {}
