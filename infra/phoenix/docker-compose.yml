services:
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: shared_phoenix
    restart: unless-stopped
    ports:
      - "0.0.0.0:6006:6006" # Web UI + OTLP HTTP collector (/v1/traces)
      - "0.0.0.0:4317:4317" # OTLP gRPC collector
    environment:
      - PHOENIX_PORT=6006
      - PHOENIX_HOST=0.0.0.0
      - PHOENIX_ENABLE_AUTH=false
      - PHOENIX_WORKING_DIR=/data
      - OPENAI_API_KEY=${OPENAI_API_KEY:-lm-studio}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-http://host.docker.internal:1234/v1}
      - OPENAI_API_BASE=${OPENAI_BASE_URL:-http://host.docker.internal:1234/v1}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - shared_phoenix_data:/data
    networks:
      phoenix_net:
        aliases:
          - phoenix

volumes:
  shared_phoenix_data:
    name: shared_phoenix_data

networks:
  phoenix_net:
    name: phoenix_net
    driver: bridge
